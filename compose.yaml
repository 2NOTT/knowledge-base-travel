name: knowledge-base-travel

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    command: etcd --advertise-client-urls=http://etcd:2379 --listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: knowledge-base-travel-minio:2025-10-15
    build: ./docker/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:9000/minio/health/live]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.5.5
    command: [milvus, run, standalone]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      MQ_TYPE: rocksmq
    ports:
      - "127.0.0.1:19530:19530"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7.0.16
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  mongo_data:
